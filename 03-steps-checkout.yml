name: 03 - Steps and Checkout

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  checkout-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Look BEFORE checkout
        run: ls -la

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Look AFTER checkout
        run: |
          ls -la
          echo "---- workflow files ----"
          ls .github/workflows

      - name: Run a command in another folder
        working-directory: .github/workflows
        run: pwd

      # TODO: your task goes here
            - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"