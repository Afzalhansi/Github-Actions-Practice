name: 09 - Step and Job Outputs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/09-outputs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Generate metadata
        id: meta
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Use the step output in a later step
        run: |
          echo "Version is ${{ steps.meta.outputs.version }}"

  report:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Use the job outputs
        run: |
          echo "Version from build job: ${{ needs.build.outputs.version }}"
          echo "Build date from build job: ${{ needs.build.outputs.build_date }}"

      - name: Print short SHA
        run: |
          echo "Short SHA from build job: ${{ needs.build.outputs.short_sha }}"