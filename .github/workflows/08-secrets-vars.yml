name: 08 - Secrets and Variables

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/08-secrets-vars.yml'

permissions:
  contents: read

jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Read a repository variable
        run: echo "APP_ENV is ${{ vars.APP_ENV }}"

      - name: Try to print a secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Secret value: $MY_SECRET"
          echo "Secret length: ${#MY_SECRET}"

      - name: Is the secret set?
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -z "$MY_SECRET" ]; then echo "secret is EMPTY"; else echo "secret is set"; fi

      # TODO: your task goes here
      - name: Show repo info with the automatic token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo view "$GITHUB_REPOSITORY"