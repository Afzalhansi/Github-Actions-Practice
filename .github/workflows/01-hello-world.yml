name: 01 - Hello World

on:
  push:
    branches: [main]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print a greeting
        run: echo "Hello from GitHub Actions!"

      - name: Show runner info
        run: |
          echo "OS: $(uname -a)"
          echo "Current directory: $(pwd)"
          ls -la